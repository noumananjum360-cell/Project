[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008", "S105", "S106", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"app/cli.py" = ["S"]
